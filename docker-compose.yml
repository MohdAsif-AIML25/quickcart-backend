# Local development stack. Run every command from this folder (quickcart-backend).
#   Only the databases (you run uvicorn and Vite yourself):  docker compose up -d db redis
#   The full stack (database, Redis, API and frontend):      docker compose up -d --build
#
#   Shop (nginx + built React app):  http://localhost:8080
#   API and Swagger, directly:       http://localhost:8000/docs
#
# Data lives in two named volumes, postgres_data and uploads_data. They survive
# "docker compose down". Only "docker compose down -v" deletes them.

services:
  db:
    image: postgres:16-alpine
    container_name: quickcart-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickcart_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quickcart}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quickcart-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: quickcart-api:local
    container_name: quickcart-api
    env_file:
      - .env
    environment:
      # Inside the Compose network, containers reach each other by SERVICE NAME
      # and the container port (5432), not by localhost:5433.
      # These two lines override the localhost values from .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quickcart}:${POSTGRES_PASSWORD:-quickcart_dev_password}@db:5432/${POSTGRES_DB:-quickcart}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy   # wait until PostgreSQL accepts connections
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    image: quickcart-web:local
    container_name: quickcart-web
    ports:
      # Not 80: that port is used by the production stack (docker-compose.prod.yml).
      # Not 5173: that one belongs to the Vite dev server (npm run dev).
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy   # nginx must be able to resolve and reach "api"

volumes:
  postgres_data:
  uploads_data:
