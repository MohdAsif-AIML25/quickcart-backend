# nginx has two jobs here:
#   1. serve the built React files
#   2. forward /api/... to the FastAPI container
# The browser sees ONE origin, so there is no CORS and no mixed-content problem.

# With HTTPS, Caddy stands in front of nginx and the browser's request arrives
# here as plain http. Keep the scheme the visitor really used, so the API never
# builds an http:// address for a page that was opened with https://.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    # Behind Caddy, every request comes from Caddy's container address. Take the
    # visitor's address from the X-Forwarded-For header instead, but ONLY when
    # the request comes from a private Docker network. A visitor who connects to
    # nginx directly has a public address, so a header they invent is ignored.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the API's 2 MB image limit, so that the API (not nginx)
    # rejects an oversized image with its own JSON error.
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 1. API calls:  /api/products  ->  http://api:8000/products
    #    The trailing slash in proxy_pass is what removes the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $http_host;
        # OVERWRITE the header with the real client address. Appending would let a
        # client send a fake X-Forwarded-For and escape the login rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 2. Built JS and CSS. Vite puts a content hash in every file name
    #    (index-Bpk8xDBT.js), so a changed file gets a new name and the old one
    #    can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html has no hash in its name, so the browser must always re-check it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 3. Everything else is a page of the React app. /cart is not a file on disk,
    #    so nginx returns index.html and React Router shows the right page.
    location / {
        try_files $uri /index.html;
    }
}
